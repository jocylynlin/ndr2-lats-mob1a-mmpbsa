# Central configuration for the 100 x 40 ns campaign. Sourced by every script.
CAMPAIGN=/home3/jocelyn/projects/hippo/campaign_saltmatched
N_TARGET=100                 # replicas per species per condition
PROD_NS=40                   # production length, ns
PROD_NSTLIM=20000000         # 40 ns at dt = 0.002 ps
FRAME_PS=10                  # ntwx 5000 steps -> one frame per 10 ps -> 4000 frames
PROD_FRAMES=4000
EQ_NS=50                     # unchanged from the original submission
HEAT_NS=1                    # unchanged
AMBER=/home3/apps/amber24/bin/pmemd.cuda
CPPTRAJ=/home3/jocelyn/apps/amber25/bin/cpptraj
PYTHON=/home3/jocelyn/miniconda3/bin/python3
PARTITION=gpu
EXCLUDE_NODES="gpu-1-5"     # 2026-11-10: segfaulted pmemd.cuda 5x across 4 species after the cooling event
SUBMIT_LIMIT=20              # per-user queued-job cap
POLL_SECONDS=20
COPY_SETTLE_S=120          # a raw file must be this old and size-stable before stripping
SEED_BASE=200000            # offset past the original campaign (which used 100003-105402) so no seed is reused
MIN_FREE_GB=400              # refuse to submit below this much free space on /home3
RAW_KEEP=20                  # keep raw solvated prod.nc/eq.nc/heat.nc for replicas 1-20 of each
                             # species+condition (~230 GB); strip the rest. The box-retaining
                             # stripped copies are kept for ALL replicas, so the periodic-image
                             # check (including MOB1A) is supported campaign-wide regardless.
                             # Solvent and ion-atmosphere analyses come from the dedicated
                             # solvent-retaining set, not from these raw files.
CONDITIONS="opc-salt-matched tip3p-matched"
TAGS="lats1_mob1a lats1_kinase ndr2_mob1a ndr2_kinase"
